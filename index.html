<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="under-container">
            <div class="quiz-nav">
                <h1>Simple Quiz Web App</h1>
                <p id="timer">Time: 30 seconds</p>
            </div>
            <hr>
            <div class="quiz-sec">
                <h2 id="quiz-ques">1. The question one tell me how options are there </h2>
                <div class="quiz-ooptions">
                    <button>option1 hi there is the best option you can chose okay </button>
                    <button>option2</button>
                    <button>option3</button>
                    <button>option4</button>
                </div>
                <p id="feedback"></p>

            </div>
            <div class="quiz-footer">
                <div class="footer-score">
                    <p id="score">Score 0/0</p>
                    <button id="restart-btn">Restart Quiz</button>
                </div>
                <div class="footer-btn">
                    <button id="next-btn">Next</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./app.js"></script>
</body>

</html>
